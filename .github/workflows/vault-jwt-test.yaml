# Copy to .github/workflows/ in BOTH swastik-rubrik/gh-workflows-swastik and
# swastik-rubrik/poc, with vault-check.sh at .github/scripts/vault-check.sh.
# Repo variable required: VAULT_ADDR (the tunnel URL).
# Each case computes its own expected result from repo/ref/environment/audience, so a
# green job means "behaved exactly as the policy requires" -- including denials.
name: vault-jwt-test
on:
  push:
    branches: ["**"]
    tags: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      ttl_test:
        description: "Also run the token-TTL expiry test (adds ~5 min)"
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

env:
  VAULT_ADDR: ${{ vars.VAULT_ADDR }}

jobs:
  no-environment:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Suite 1: repo / ref / audience / environment / unknown role
          - { id: T1,  role: gh-main,         aud: "https://github.com/swastik-rubrik" }  # allowed only: gh-workflows repo @ main
          - { id: T2,  role: poc-main,        aud: "https://github.com/swastik-rubrik" }  # allowed only: poc repo @ main
          - { id: T3,  role: gh-env-prod,     aud: "https://github.com/swastik-rubrik" }  # env-bound role without environment -> always denied
          - { id: T4,  role: gh-main,         aud: "wrong-audience" }                     # wrong audience -> always denied
          - { id: T5,  role: no-such-role,    aud: "https://github.com/swastik-rubrik" }  # nonexistent role -> always denied
          # Suite 2: immutable-ID binding
          - { id: T7,  role: gh-id-pinned,    aud: "https://github.com/swastik-rubrik" }  # name + repository_id + owner_id -> allowed on main
          - { id: T8,  role: gh-id-wrong,     aud: "https://github.com/swastik-rubrik" }  # right name, wrong repository_id -> always denied
          # Suite 3: OR list and glob
          - { id: T9,  role: gh-ref-or,       aud: "https://github.com/swastik-rubrik" }  # allowed on main OR staging
          - { id: T10, role: gh-release-glob, aud: "https://github.com/swastik-rubrik" }  # allowed only on release/*
    steps:
      - uses: actions/checkout@v4
      - run: bash .github/scripts/vault-check.sh "${{ matrix.id }}" "${{ matrix.role }}" "${{ matrix.aud }}"

  prod-environment:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - run: bash .github/scripts/vault-check.sh T6 gh-env-prod "https://github.com/swastik-rubrik" prod

  # Suite 4: token TTL. Manual only (workflow_dispatch with ttl_test = true), run on main.
  ttl:
    if: github.event_name == 'workflow_dispatch' && inputs.ttl_test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: TTL_TEST=1 bash .github/scripts/vault-check.sh T11 gh-main "https://github.com/swastik-rubrik"
