# Copies first-party images from GCP Artifact Registry into JFrog Artifactory.
#
# Reads one images file from the calling repository and reconciles it, one
# parallel job per GCP project listed in it. Every image lands in the file's
# single `target_repo`.
#
# Call it from your own repository. The permissions block MUST sit at the
# workflow level, not inside the job -- a `uses:` job runs with what the caller
# grants at workflow level, and a job-level block there can only restrict it:
#
#   permissions:
#     contents: read
#     id-token: write    # GCP Workload Identity Federation
#
#   jobs:
#     onboard:
#       uses: swastik-rubrik/gh-workflows-swastik/.github/workflows/jfrog-images-onboarding.yml@main
#       secrets:
#         JFROG_USERNAME: ${{ secrets.JFROG_USERNAME }}
#         JFROG_TOKEN: ${{ secrets.JFROG_TOKEN }}
#
# The two secrets are repository secrets in the calling repo. Every input has a
# default that suits the shared instance:
#   images_file            images.yaml
#   artifactory_registry   beelzi.jfrog.io
#   artifactory_path_style true
#   dry_run                false
#
name: JFrog Images Onboarding

on:
  workflow_call:
    inputs:
      images_file:
        description: Path in the CALLING repository to the images YAML file
        type: string
        required: false
        default: images.yaml
      artifactory_registry:
        description: Destination registry host. Defaults to the shared instance.
        type: string
        required: false
        default: beelzi.jfrog.io
      dry_run:
        description: Resolve digests and report, copy nothing
        type: boolean
        required: false
        default: false
      # To be removed in the Rubrik JFrog
      artifactory_path_style:
        description: >-
          Prepend the repo key to the image path instead of subdomain routing.
          Required on a free JFrog instance, which has no per-repo subdomains.
        type: boolean
        required: false
        default: true
      action_ref:
        description: Ref of gh-workflows-swastik to load the composite action from
        type: string
        required: false
        default: main
    secrets:
      JFROG_USERNAME:
        description: Artifactory user the token belongs to
        required: true
      JFROG_TOKEN:
        description: Artifactory access token with deploy rights on target_repo
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  plan:
    name: Build matrix jobs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
      count: ${{ steps.build.outputs.count }}
    steps:
      - name: Checkout calling repository
        uses: actions/checkout@v4.2.2

      - name: Checkout shared workflows repository
        uses: actions/checkout@v4.2.2
        with:
          repository: swastik-rubrik/gh-workflows-swastik
          ref: ${{ inputs.action_ref }}
          path: .gh-workflows-swastik

      - name: Install matrix builder dependencies
        run: python3 -m pip install --quiet --disable-pip-version-check pyyaml

      - name: Build matrix
        id: build
        env:
          IMAGES_FILE: ${{ inputs.images_file }}
        run: |
          set -euo pipefail

          MATRIX=$(python3 \
            .gh-workflows-swastik/actions/jfrog-images-publish/scripts/build-matrix.py \
            --file "$IMAGES_FILE")

          COUNT=$(echo "$MATRIX" | python3 -c 'import json,sys; print(len(json.load(sys.stdin)["include"]))')
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "count=$COUNT"   >> "$GITHUB_OUTPUT"

  publish:
    name: ${{ matrix.name }}
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest

    strategy:
      # One entry per GCP project
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout shared workflows repository
        uses: actions/checkout@v4.2.2
        with:
          repository: swastik-rubrik/gh-workflows-swastik
          ref: ${{ inputs.action_ref }}
          path: .gh-workflows-swastik

      - name: Onboard images
        uses: ./.gh-workflows-swastik/actions/jfrog-images-publish
        with:
          images: ${{ toJSON(matrix.images) }}
          gcp_project: ${{ matrix.gcp_project }}
          source_registry: ${{ matrix.source_registry }}
          wif_provider: ${{ matrix.wif_provider }}
          gcp_sa_email: ${{ matrix.gcp_sa_email }}
          artifactory_registry: ${{ inputs.artifactory_registry }}
          artifactory_path_style: ${{ inputs.artifactory_path_style }}
          target_repo: ${{ matrix.target_repo }}
          # Composite actions cannot read the secrets context, so the
          # credentials are handed over as inputs. They stay masked in logs.
          artifactory_username: ${{ secrets.JFROG_USERNAME }}
          artifactory_token: ${{ secrets.JFROG_TOKEN }}
          dry_run: ${{ inputs.dry_run }}
