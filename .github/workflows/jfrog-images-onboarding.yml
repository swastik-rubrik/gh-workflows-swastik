# Copies first-party images from GCP Artifact Registry into JFrog Artifactory.
#
# Every team file in teams_dir is reconciled, one parallel job per
# (team, project). The Vault JWT role is scoped to a team, so each job holds
# exactly one team's Artifactory token and can push only to that team's
# 
# Call it from your own repository. The permissions block MUST sit at the
# workflow level, not inside the job -- a `uses:` job runs with what the caller
# grants at workflow level, and a job-level block there can only restrict it:
#
#   permissions:
#     contents: read
#     id-token: write    
#
#   jobs:
#     onboard:
#       uses: swastik-rubrik/gh-workflows-swastik/.github/workflows/jfrog-images-onboarding.yml@main
#       with:
#         teams_dir: <teams-dir>  # optional, default: teams
#         artifactory_registry: <your-artifactory-host>
#         vault_url: <VAULT_ADDR>
#         team: <team-name>       # optional; omit to reconcile every team file
#
name: JFrog Images Onboarding

on:
  workflow_call:
    inputs:
      team:
        description: >-
          Team to reconcile -- the teams_dir filename without its extension.
          Omit to fan out over every team file in teams_dir; each file still
          gets its own Vault role, scoped to that team.
        type: string
        required: false
        default: ''
      teams_dir:
        description: Directory in the CALLING repository holding the per-team YAML files
        type: string
        required: false
        default: teams
      artifactory_registry:
        description: Destination registry host
        type: string
        required: true
      environment:
        description: >-
          Environment to reconcile. Selects the Vault secret path holding this
          team's Artifactory credentials, and labels the job summary.
        type: string
        required: false
        default: prod
      dry_run:
        description: Resolve digests and report, copy nothing
        type: boolean
        required: false
        default: false
      artifactory_path_style:
        description: Prepend the repo key to the image path instead of subdomain routing
        type: boolean
        required: false
        default: false
      vault_url:
        description: Vault address. Artifactory credentials always come from Vault.
        type: string
        required: true
      vault_jwt_mount:
        description: Path of the Vault JWT auth mount trusting GitHub's OIDC issuer
        type: string
        required: false
        default: jwt-github
      action_ref:
        description: Ref of gh-workflows-swastik to load the composite action from
        type: string
        required: false
        default: main

permissions:
  contents: read
  id-token: write

jobs:
  plan:
    name: Build matrix jobs
    runs-on: ubuntu-latest
    # Reads YAML and resolves nothing remote -- no OIDC token here.
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
      count: ${{ steps.build.outputs.count }}
    steps:
      - name: Checkout calling repository
        uses: actions/checkout@v4.2.2

      - name: Checkout shared workflows repository
        uses: actions/checkout@v4.2.2
        with:
          repository: swastik-rubrik/gh-workflows-swastik
          ref: ${{ inputs.action_ref }}
          path: .gh-workflows-swastik

      - name: Install matrix builder dependencies
        run: python3 -m pip install --quiet --disable-pip-version-check pyyaml

      - name: Build matrix
        id: build
        env:
          TEAMS_DIR: ${{ inputs.teams_dir }}
          TEAM: ${{ inputs.team }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail

          # An empty team means "every file in teams_dir"; passing --team ''
          # would instead look for a file with no name. The +... form keeps the
          # expansion valid under `set -u` when the array is empty.
          TEAM_ARG=()
          if [ -n "$TEAM" ]; then
            TEAM_ARG=(--team "$TEAM")
          fi

          MATRIX=$(python3 \
            .gh-workflows-swastik/actions/jfrog-images-publish/scripts/build-matrix.py \
            --teams-dir "$TEAMS_DIR" \
            ${TEAM_ARG[@]+"${TEAM_ARG[@]}"} \
            --environment "$ENVIRONMENT")

          COUNT=$(echo "$MATRIX" | python3 -c 'import json,sys; print(len(json.load(sys.stdin)["include"]))')
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "count=$COUNT"   >> "$GITHUB_OUTPUT"

  publish:
    name: ${{ matrix.name }}
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest

    strategy:
      # One entry per (team, project)
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout shared workflows repository
        uses: actions/checkout@v4.2.2
        with:
          repository: swastik-rubrik/gh-workflows-swastik
          ref: ${{ inputs.action_ref }}
          path: .gh-workflows-swastik

      - name: Onboard images
        uses: ./.gh-workflows-swastik/actions/jfrog-images-publish
        with:
          images: ${{ toJSON(matrix.images) }}
          gcp_project: ${{ matrix.gcp_project }}
          source_registry: ${{ matrix.source_registry }}
          wif_provider: ${{ matrix.wif_provider }}
          gcp_sa_email: ${{ matrix.gcp_sa_email }}
          artifactory_registry: ${{ inputs.artifactory_registry }}
          artifactory_path_style: ${{ inputs.artifactory_path_style }}
          target_repo: ${{ matrix.target_repo }}
          vault_url: ${{ inputs.vault_url }}
          vault_path: ${{ matrix.vault_path }}
          vault_jwt_mount: ${{ inputs.vault_jwt_mount }}
          vault_role: ${{ matrix.vault_role }}
          dry_run: ${{ inputs.dry_run }}
          team: ${{ matrix.team }}
          environment: ${{ inputs.environment }}