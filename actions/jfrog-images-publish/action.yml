name: JFrog Images Publish
description: Copy first-party container images from GCP Artifact Registry into JFrog Artifactory, reconciling by digest

inputs:
  images:
    description: JSON array of {source, target_path, tag} objects to reconcile
    required: true
  gcp_project:
    description: GCP project holding the source Artifact Registry
    required: true
  source_registry:
    description: Source registry host, e.g. us-docker.pkg.dev (region-specific)
    required: true
  wif_provider:
    description: Full resource name of the Workload Identity Provider
    required: true
  gcp_sa_email:
    description: Service account to impersonate; needs artifactregistry.reader only
    required: true
  artifactory_registry:
    description: Destination registry host, e.g. myorg.jfrog.io
    required: true
  artifactory_path_style:
    description: Prepend target_repo to the image path instead of relying on subdomain routing
    required: false
    default: "false"
  target_repo:
    description: Artifactory repo key; used as the path prefix when artifactory_path_style is true
    required: false
    default: ""
  artifactory_username:
    description: Artifactory user the token belongs to (the caller's JFROG_USERNAME secret)
    required: true
  artifactory_token:
    description: Artifactory access token with deploy rights on target_repo (the caller's JFROG_TOKEN secret)
    required: true
  dry_run:
    description: Resolve digests and report what would be copied, but copy nothing
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Setup crane
      # crane, not docker: `crane copy` retains the source digest, while docker pull/tag/push re-compresses and produces a different one -- the
      # artifact would no longer be bit-identical to what was tested. It also preserves the multi-arch index, which docker flattens.
      uses: imjasonh/setup-crane@v0.7

    # --- (GCP AR) Source credentials -----------------------------------------------
    - name: Check OIDC token is available
      # WIF exchanges the runner's GitHub OIDC token for GCP credentials.
      shell: bash
      run: |
        set -euo pipefail
        if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
          echo "::error::no OIDC token available: the calling workflow needs 'permissions: id-token: write'"
          exit 1
        fi

    - name: Authenticate to GCP via Workload Identity Federation
      id: gcp
      uses: google-github-actions/auth@v3
      with:
        project_id: ${{ inputs.gcp_project }}
        workload_identity_provider: ${{ inputs.wif_provider }}
        service_account: ${{ inputs.gcp_sa_email }}
        # A registry login needs an access token, and minting one requires the service-account impersonation path.
        token_format: access_token

    # --- Log in: GCP AR (source) and JFrog (destination) ---------------------------
    - name: Log in to both registries
      shell: bash
      env:
        GCP_TOKEN: ${{ steps.gcp.outputs.access_token }}
        SOURCE_REGISTRY: ${{ inputs.source_registry }}
        DEST_REGISTRY: ${{ inputs.artifactory_registry }}
        ARTIFACTORY_USERNAME: ${{ inputs.artifactory_username }}
        ARTIFACTORY_TOKEN: ${{ inputs.artifactory_token }}
      run: |
        set -euo pipefail
        : "${ARTIFACTORY_USERNAME:?JFROG_USERNAME is empty -- set it as a repository secret and pass it in the caller's secrets: block}"
        : "${ARTIFACTORY_TOKEN:?JFROG_TOKEN is empty -- set it as a repository secret and pass it in the caller's secrets: block}"
        echo "$GCP_TOKEN" | crane auth login "$SOURCE_REGISTRY" \
          --username oauth2accesstoken --password-stdin
        echo "$ARTIFACTORY_TOKEN" | crane auth login "$DEST_REGISTRY" \
          --username "$ARTIFACTORY_USERNAME" --password-stdin

    - name: Reconcile images
      shell: bash
      env:
        IMAGES_JSON: ${{ inputs.images }}
        DEST_REGISTRY: ${{ inputs.artifactory_registry }}
        DEST_PREFIX: ${{ inputs.artifactory_path_style == 'true' && inputs.target_repo || '' }}
        DRY_RUN: ${{ inputs.dry_run }}
        # Summary labels only -- these do not affect what gets copied.
        GCP_PROJECT: ${{ inputs.gcp_project }}
        TARGET_REPO: ${{ inputs.target_repo }}
      run: bash "${GITHUB_ACTION_PATH}/scripts/publish.sh"

    - name: Clean up credentials
      if: always()
      shell: bash
      run: rm -f "${HOME}/.docker/config.json" gha-creds-*.json || true
